    <script>
      // If loaded inside an OAuth popup window, notify opener, BroadcastChannel, and localStorage, then close
      (function() {
        var isOAuth = window.location.hash.indexOf('access_token=') !== -1 ||
                      window.location.search.indexOf('code=') !== -1 ||
                      window.location.search.indexOf('error=') !== -1;
        if (isOAuth) {
          var payload = {
            type: 'SUPABASE_OAUTH_SUCCESS',
            hash: window.location.hash,
            search: window.location.search
          };

          // 1. Post to opener window if accessible
          if (window.opener) {
            try {
              window.opener.postMessage(payload, '*');
            } catch(e) {
              console.warn('postMessage error:', e);
            }
          }

          // 2. Broadcast across windows/iframes on same origin
          try {
            if (typeof BroadcastChannel !== 'undefined') {
              var bc = new BroadcastChannel('supabase_oauth_channel');
              bc.postMessage(payload);
            }
          } catch(e) {}

          // 3. Fallback via localStorage storage event
          try {
            localStorage.setItem('supabase_oauth_relay', JSON.stringify({ payload: payload, time: Date.now() }));
          } catch(e) {}

          // Close popup if opened as popup
          if (window.opener || window.name === 'google_oauth_popup') {
            setTimeout(function() {
              try {
                window.close();
              } catch(e) {}
            }, 600);
          }
        }
      })();
    </script>
